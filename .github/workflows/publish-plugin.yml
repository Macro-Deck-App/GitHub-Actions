# The Macro Deck plugin publishing workflow.
#
# It is a *reusable* workflow rather than a composite action, and that distinction is the entire
# security design. A composite action runs inside the caller's own job, so the OIDC token's
# job_workflow_ref still names the creator's workflow and proves nothing about the build steps. A
# reusable workflow invoked with `uses:` sets job_workflow_ref to this file, while `repository` and
# `sha` still name the creator's repository and commit - which is exactly the pair the Platform
# needs. The Platform's TrustedBuild:ApprovedJobWorkflowRefs allowlist names this file, at a `v*` tag,
# and this file only.
#
# Setting up the CLI and building are the composite actions under actions/ in this repository, which
# are useful on their own for builds that are not published. They are referenced by repository and
# major tag, never by a local path: `./` would resolve against the caller's checkout, handing the
# build steps to the very repository whose build this workflow is meant to vouch for. The upload
# stays in this file: it is only ever accepted from here, so it has no use as an action.
#
# What it does: builds and packs the plugin with the Macro Deck plugin CLI, optionally keeps the
# package as a workflow artifact, then uploads it to the Platform, where it lands in the Project's
# build library. A release is started from it in the Creator Portal.

name: Publish a Macro Deck plugin

on:
  workflow_call:
    inputs:
      version:
        description: >-
          The version this build declares; one leading `v` is dropped, so a tag name can be passed
          as-is. It is written into the plugin's manifest.json and set as the assembly version, so
          the version in the repository does not matter. A release started from the build in the
          Creator Portal takes this number.
        required: true
        type: string
      build:
        description: >-
          The build identifier, 1-64 letters, digits, `.`, `-`, `_` or `+`. Defaults to the run
          number.
        required: false
        type: string
        default: ''
      source:
        description: The plugin project directory, holding manifest.json and macrodeck-build.json.
        required: true
        type: string
      changelog:
        required: false
        type: string
        default: ''
      cli-version:
        description: The MacroDeck.Plugin.Cli version to build with. Defaults to the newest prerelease.
        required: false
        type: string
        default: ''
      upload-artifact:
        description: Also keep the built .macroDeckPlugin as a workflow artifact of the run.
        required: false
        type: boolean
        default: false
      artifact-name:
        description: The workflow artifact's name. Defaults to the package file name.
        required: false
        type: string
        default: ''
      artifact-retention-days:
        description: Days to keep the workflow artifact, 1-90. 0 uses the repository's default.
        required: false
        type: number
        default: 0
      platform-url:
        required: false
        type: string
        default: https://api.macro-deck.app
      audience:
        description: >-
          The audience the Platform expects in the OIDC token. Changing it means the Platform will
          refuse the upload, which is the point: a token minted for somebody else is not a token
          for us.
        required: false
        type: string
        default: https://api.macro-deck.app

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only permission that matters here. Without it the runner cannot mint an OIDC token and
      # the upload has no credential at all - there is no fallback secret to fall back to.
      id-token: write
    steps:
      # Pinned to the commit the workflow was called for rather than to a moving ref. The token
      # attests to github.sha, so building anything else would make the attestation a false
      # statement about the bytes.
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the Macro Deck plugin CLI
        uses: Macro-Deck-App/GitHub-Actions/actions/setup-plugin-cli@v1
        with:
          cli-version: ${{ inputs.cli-version }}

      - name: Build and pack
        id: build
        uses: Macro-Deck-App/GitHub-Actions/actions/build-plugin@v1
        with:
          source: ${{ inputs.source }}
          version: ${{ inputs.version }}

      # Before the Platform upload, so the package is kept even when the Platform refuses it.
      - name: Keep the package as a workflow artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name || steps.build.outputs.package-file-name }}
          path: ${{ steps.build.outputs.package-path }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error

      # Optional. The NuGet packages the build restored, for the moderator and the security scan: each
      # package with its resolved version, whether the project references it directly, the feed it
      # came from and any known vulnerability. Nothing here can fail the release - on any problem the
      # file is left out with a warning and the upload goes ahead without it. The schema is in the
      # README. The Platform refuses a file that breaks it, so this step keeps within its limits
      # (1 MiB, 5,000 packages) rather than send one that would fail the upload.
      - name: List the dependencies
        continue-on-error: true
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -uo pipefail
          work="${RUNNER_TEMP}/dependencies"
          rm -rf "${work}"
          mkdir -p "${work}" "${RUNNER_TEMP}/upload"
          rm -f "${RUNNER_TEMP}/upload/dependencies.json"
          skip() {
            echo "::warning::The build is uploaded without a dependency list: $1"
            exit 0
          }

          # The project macrodeck-build.json publishes, or else the only project file beside it.
          project=""
          if [ -f "${SOURCE}/macrodeck-build.json" ]; then
            project="$(jq -r '[.targets[]? | select(.executable == "dotnet") | .arguments[]?
              | strings | select(test("\\.(cs|fs|vb)proj$"))] | first // empty' \
              "${SOURCE}/macrodeck-build.json" 2>/dev/null)" || project=""
          fi
          if [ -z "${project}" ]; then
            shopt -s nullglob
            candidates=("${SOURCE}"/*.csproj "${SOURCE}"/*.fsproj "${SOURCE}"/*.vbproj)
            shopt -u nullglob
            [ "${#candidates[@]}" -eq 1 ] || skip "no single project file was found in ${SOURCE}."
            project="$(basename "${candidates[0]}")"
          fi
          case "${project}" in
            /*) project_path="${project}" ;;
            *) project_path="${SOURCE}/${project}" ;;
          esac
          [ -f "${project_path}" ] || skip "${project_path} does not exist."

          assets="$(dotnet msbuild "${project_path}" -getProperty:ProjectAssetsFile 2>/dev/null | tail -n 1)" || assets=""
          if [ -z "${assets}" ] || [ ! -f "${assets}" ]; then
            dotnet restore "${project_path}" > "${work}/restore.log" 2>&1 || skip "the project could not be restored."
            assets="$(dirname "${project_path}")/obj/project.assets.json"
          fi
          [ -f "${assets}" ] || skip "the project's assets file was not found."

          dotnet list "${project_path}" package --include-transitive --format json \
            > "${work}/packages.json" 2> "${work}/packages.log" \
            || skip "dotnet list package failed."

          # Needs the feeds' vulnerability data (nuget.org's). If it cannot be reached, only this part
          # is lost, and the list says it was not checked.
          checked=true
          if ! dotnet list "${project_path}" package --vulnerable --include-transitive --format json \
            > "${work}/vulnerable.json" 2> "${work}/vulnerable.log" \
            || ! jq -e '.version == 1' "${work}/vulnerable.json" > /dev/null 2>&1; then
            echo "::warning::Known vulnerabilities could not be checked; the dependency list says so."
            checked=false
            echo '{}' > "${work}/vulnerable.json"
          fi

          # Which feed each package came from, from the .nupkg.metadata NuGet writes beside it in the
          # packages folder. The first folder holding a package wins; one without metadata has no source.
          jq -r '(.packageFolders // {} | keys[]) as $folder | .libraries // {} | to_entries[]
            | select(.value.type == "package")
            | [(.key | ascii_downcase), "\($folder | rtrimstr("/"))/\(.value.path)/.nupkg.metadata"] | @tsv' \
            "${assets}" > "${work}/libraries.tsv" || skip "the assets file could not be read."
          while IFS=$'\t' read -r key metadata; do
            [ -f "${metadata}" ] || continue
            feed="$(jq -r '.source // empty' "${metadata}" 2>/dev/null)" || continue
            [ -n "${feed}" ] && printf '%s\t%s\n' "${key}" "${feed}"
          done < "${work}/libraries.tsv" > "${work}/resolved.tsv"
          jq -Rn '[inputs | split("\t") | {key: .[0], value: .[1]}] | reverse | from_entries' \
            "${work}/resolved.tsv" > "${work}/resolved.json" || skip "the package feeds could not be read."

          jq -n \
            --slurpfile packages "${work}/packages.json" \
            --slurpfile vulnerable "${work}/vulnerable.json" \
            --slurpfile assets "${assets}" \
            --slurpfile resolved "${work}/resolved.json" \
            --argjson checked "${checked}" \
            --arg workspace "${GITHUB_WORKSPACE%/}" \
            --arg sdk "$(dotnet --version)" \
            '
            # A feed inside the checkout is written relative to it (./local-feed), so the Platform can
            # tell a committed feed from one on the runner. Credentials and query strings are dropped.
            def feed:
              sub("/+$"; "")
              | if $workspace != "" and startswith($workspace + "/") then "./" + ltrimstr($workspace + "/")
                elif test("^https?://"; "i") then sub("^(?<scheme>[A-Za-z]+://)[^/@]*@"; "\(.scheme)") | sub("[?#].*$"; "")
                else . end;
            ($vulnerable[0].projects[0].frameworks // [] | map(.framework as $framework
              | ((.topLevelPackages // []) + (.transitivePackages // []))[]
              | {key: "\($framework)|\(.id | ascii_downcase)",
                 value: [.vulnerabilities[]? | {severity, advisoryUrl: .advisoryurl}]})
              | from_entries) as $advisories
            | {
                schemaVersion: 1,
                generatedBy: "Macro-Deck-App/GitHub-Actions publish-plugin.yml",
                sdkVersion: $sdk,
                vulnerabilitiesChecked: $checked,
                sources: [$assets[0].project.restore.sources // {} | keys[] | feed] | unique,
                frameworks: [$packages[0].projects[0].frameworks[]? | .framework as $framework | {
                  framework: $framework,
                  packages: [
                    ((.topLevelPackages // [])[] | . + {direct: true}),
                    ((.transitivePackages // [])[] | . + {direct: false})
                    | select(.resolvedVersion != null)
                    | {id, requestedVersion, resolvedVersion, direct,
                       source: ($resolved[0]["\(.id | ascii_downcase)/\(.resolvedVersion | ascii_downcase)"]
                         | if . == null then null else feed end),
                       vulnerabilities: ($advisories["\($framework)|\(.id | ascii_downcase)"] // [])}
                    | with_entries(select(.value != null))
                  ]
                }]
              }
            ' > "${work}/dependencies.json" || skip "the dependency list could not be assembled."

          count="$(jq '[.frameworks[].packages | length] | add // 0' "${work}/dependencies.json")" \
            || skip "the dependency list could not be read back."
          size="$(wc -c < "${work}/dependencies.json" | tr -d ' ')"
          [ "${count}" -le 5000 ] || skip "${count} packages is more than the 5,000 the Platform accepts."
          [ "${size}" -le 1048576 ] || skip "the list is larger than the 1 MiB the Platform accepts."
          mv "${work}/dependencies.json" "${RUNNER_TEMP}/upload/dependencies.json"
          echo "Listed ${count} package references for $(jq -r '[.frameworks[].framework] | join(", ")' "${RUNNER_TEMP}/upload/dependencies.json")."

      # build-metadata.json says which Project this upload is for, which version and build it is,
      # and nothing else. The package identifier is the manifest's own `id`, so the upload can never
      # name a different package than the one it contains. Every provenance value - repository,
      # commit, tag, run - is read from the OIDC token by the Platform, so writing them here would
      # achieve nothing: they are ignored.
      - name: Pack the upload
        env:
          PACKAGE_PATH: ${{ steps.build.outputs.package-path }}
          SOURCE: ${{ inputs.source }}
          DECLARED_VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          package_id="$(jq -r '.id // empty' "${SOURCE}/manifest.json")"
          if [ -z "${package_id}" ]; then
            echo "::error file=${SOURCE}/manifest.json::manifest.json has no id."
            exit 1
          fi
          echo "Publishing ${package_id}."
          artifact="$(basename "${PACKAGE_PATH}")"
          mkdir -p "${RUNNER_TEMP}/upload"
          cp "${PACKAGE_PATH}" "${RUNNER_TEMP}/upload/${artifact}"
          jq -n \
            --arg packageId "${package_id}" \
            --arg version "${DECLARED_VERSION#v}" \
            --arg build "${BUILD:-${GITHUB_RUN_NUMBER}}" \
            --arg artifactFileName "${artifact}" \
            --arg changelog "${CHANGELOG}" \
            '{schemaVersion: 1, packageId: $packageId, version: $version, build: $build,
              artifactFileName: $artifactFileName, changelog: $changelog}' \
            > "${RUNNER_TEMP}/upload/build-metadata.json"
          (cd "${RUNNER_TEMP}/upload" && zip -q -r ../build.zip .)

      # Requested as late as possible: the token is short-lived, and there is nothing to gain by
      # holding one across a build that might take minutes.
      - name: Request a build identity and upload
        env:
          AUDIENCE: ${{ inputs.audience }}
          PLATFORM_URL: ${{ inputs.platform-url }}
        run: |
          set -euo pipefail
          echo "Requesting a GitHub Actions OIDC token for ${AUDIENCE}..."
          token="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')"
          if [ -z "${token}" ] || [ "${token}" = "null" ]; then
            echo "::error::No OIDC token was issued. Does the job have id-token: write?"
            exit 1
          fi
          echo "Uploading $(du -h "${RUNNER_TEMP}/build.zip" | cut -f1) to ${PLATFORM_URL%/}/api/v1/builds..."
          # The progress meter stays on (no -s): once it reaches 100% the time left is the Platform
          # verifying and storing the build. HTTP/1.1 because an HTTP/2 stream is capped by the proxy's
          # flow-control window (64 KiB in Envoy), which limits a long-distance upload to about half a
          # megabyte per second.
          response="${RUNNER_TEMP}/upload-response.json"
          if ! status="$(curl -S --http1.1 -o "${response}" -w '%{http_code}' -X POST "${PLATFORM_URL%/}/api/v1/builds" \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/zip" \
            --data-binary @"${RUNNER_TEMP}/build.zip")"; then
            echo "::error title=Upload failed::The build could not be sent to ${PLATFORM_URL%/}. See the log above."
            exit 1
          fi

          if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
            echo "The Macro Deck Platform accepted the build (HTTP ${status})."
            exit 0
          fi

          # A refusal is written to be read by whoever triggered the release: its title and detail become
          # the run's error annotation and job summary, and the run fails.
          title="$(jq -r '.title // empty' "${response}" 2>/dev/null || true)"
          detail="$(jq -r '.detail // empty' "${response}" 2>/dev/null || true)"
          [ -n "${title}" ] || title="The Macro Deck Platform refused the build (HTTP ${status})."
          [ -n "${detail}" ] || detail="$(head -c 2000 "${response}" 2>/dev/null || true)"
          escape_data() { local value="${1//%/%25}"; value="${value//$'\r'/%0D}"; printf '%s' "${value//$'\n'/%0A}"; }
          escape_property() { local value; value="$(escape_data "$1")"; value="${value//:/%3A}"; printf '%s' "${value//,/%2C}"; }
          echo "::error title=$(escape_property "${title}")::$(escape_data "${detail:-${title}}")"
          {
            echo "### The Macro Deck Platform refused this build"
            echo
            echo "**${title}**"
            echo
            [ -z "${detail}" ] || echo "${detail}"
            echo
            echo "HTTP ${status}"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
